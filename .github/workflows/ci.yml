name: Soft Potato CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-test:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install the package with test dependencies, plus quality tools
        pip install -e .[test]
        pip install mypy black ruff pytest-cov

    - name: Check code formatting with Black
      run: |
        black --check src/ tests/

    - name: Lint with Ruff
      run: |
        # Enforces PEP 8 and checks for logical errors
        ruff check src/ tests/

    - name: Static type checking with Mypy
      run: |
        # Validates strict type hinting across the core and simulate modules
        mypy src/

    - name: Execute pytest suite with Coverage
      run: |
        # Runs tests and generates a terminal coverage report
        pytest tests/ -v --cov=softpotato --cov-report=term-missing
